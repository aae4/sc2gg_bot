[project]
name = "sc2gg-bot"
version = "2.0.0"
description = "Telegram bot for StarCraft II replay analysis and Telegram Mini App viewer"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.10.0,<4.0.0",
    "pydantic-settings>=2.5.0,<3.0.0",
    "sc2reader>=1.8.0",
    "pillow>=11.0.0",
    "matplotlib>=3.9.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
